project:
  title:        "PPU Demo"
  author:       "HexTex"
  discord:      ""
  description:  "A console-style PPU: scrolling tile map, 64 sprites with an 8-per-line limit, split screen, palettes"
  language:     "Verilog"
  clock_hz:     25175000

  tiles: "1x1"

  top_module:  "tt_um_hextex_ppu_demo"

  source_files:
    - "tt_um_hextex_ppu_demo.v"
    - "demo_cpu.v"
    - "ppu.v"
    - "vga_timing.v"
    - "chr_rom.v"
    - "gamepad_pmod_rx.v"

pinout:
  ui[0]: "up (held while on)"
  ui[1]: "down"
  ui[2]: "left"
  ui[3]: "right"
  ui[4]: "gamepad latch"
  ui[5]: "gamepad clock"
  ui[6]: "gamepad data"
  ui[7]: "row mode"

  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
